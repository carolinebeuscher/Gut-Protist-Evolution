# ---------------------------------------------------------------------------
# profiles/slurm/config.yaml
#
# Snakemake SLURM profile using the official executor plugin.
#
# Install the plugin once:
#   pip install snakemake-executor-plugin-slurm
#
# Activate with:
#   snakemake -s Snakefile.smk --profile profiles/slurm
# ---------------------------------------------------------------------------

executor: slurm
use-conda: true
jobs: 50
latency-wait: 600
retries: 3
printshellcmds: true
keep-going: true

# ---------------------------------------------------------------------------
# Default resources — applied to every rule not listed in set-resources below
# Runtime in minutes
# ---------------------------------------------------------------------------
default-resources:
  slurm_account: "gts-alind6-postpaid"
  slurm_partition: "inferno"
  mem_mb: 16000
  runtime: 720
  tasks: 1
  cpus_per_task: 4

# ---------------------------------------------------------------------------
# Per-rule resource overrides
# ---------------------------------------------------------------------------
